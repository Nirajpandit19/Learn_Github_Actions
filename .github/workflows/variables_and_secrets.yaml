name: variables_and_secrets

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MY_NAME: ${{ vars.MY_NAME }}   # Cleaner way — load at job level

    steps:
      - name: Print who is building
        run: echo "Hey, the project is being built by $MY_NAME"

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_PASSWD }}" | docker login -u "${{ secrets.DOCKER_HUB_USER }}" --password-stdin

      - name: Build the project
        run: echo "Build step running..."